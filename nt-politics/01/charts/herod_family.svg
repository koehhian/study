<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 587" role="img" aria-label="希律家族辨識圖"><title>希律家族辨識圖</title><desc>大希律的兒子包括亞基老、安提帕、分封王腓力和亞里斯多布。希羅底與亞基帕一世是亞里斯多布的子女。希羅底後來嫁安提帕，因此既是其妻子也是其姪女。</desc><defs><marker id="herod_svg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627d88"/></marker></defs><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><rect x="420" y="20" width="320" height="85" rx="14" fill="#e7efe7" stroke="#cfbd9c" stroke-width="2"/><text x="580.0" y="54" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">大希律</text><text x="580.0" y="82" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">耶穌降生敘事中的希律；前4年去世</text><path d="M580 105 V140 H150 V185" fill="none" stroke="#627d88" stroke-width="2.5"/><path d="M580 140 H460 V185" fill="none" stroke="#627d88" stroke-width="2.5"/><path d="M580 140 H770 V185" fill="none" stroke="#627d88" stroke-width="2.5"/><path d="M580 140 H1080 V185" fill="none" stroke="#627d88" stroke-width="2.5"/><rect x="20" y="185" width="260" height="112" rx="14" fill="#fffdf8" stroke="#cfbd9c" stroke-width="2"/><text x="150.0" y="219" font-size="21" fill="#203544" font-weight="700" text-anchor="middle">亞基老</text><text x="150.0" y="247" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">猶太／撒馬利亞／以土買</text><text x="150.0" y="270" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">公元6年被廢；領地改羅馬直轄</text><a href="#person-antipas"><rect x="330" y="185" width="260" height="112" rx="14" fill="#e7efe7" stroke="#cfbd9c" stroke-width="2"/><text x="460.0" y="219" font-size="21" fill="#203544" font-weight="700" text-anchor="middle">安提帕</text><text x="460.0" y="247" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">加利利／比利亞</text><text x="460.0" y="270" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">受難事件中的「希律」</text></a><rect x="640" y="185" width="260" height="112" rx="14" fill="#fffdf8" stroke="#cfbd9c" stroke-width="2"/><text x="770.0" y="219" font-size="21" fill="#203544" font-weight="700" text-anchor="middle">分封王腓力</text><text x="770.0" y="247" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">加利利海東北一帶</text><text x="770.0" y="270" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">不是受難審問者</text><rect x="950" y="185" width="260" height="112" rx="14" fill="#fffdf8" stroke="#cfbd9c" stroke-width="2"/><text x="1080.0" y="219" font-size="20" fill="#203544" font-weight="700" text-anchor="middle">亞里斯多布四世</text><text x="1080.0" y="247" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">大希律之子</text><text x="1080.0" y="270" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">以下二人的父親</text><path d="M1080 297 V343 H910 V390" fill="none" stroke="#627d88" stroke-width="2.5"/><path d="M1080 343 H1190 V390" fill="none" stroke="#627d88" stroke-width="2.5"/><a href="#person-herodias"><rect x="780" y="390" width="260" height="112" rx="14" fill="#e7efe7" stroke="#cfbd9c" stroke-width="2"/><text x="910.0" y="424" font-size="21" fill="#203544" font-weight="700" text-anchor="middle">希羅底</text><text x="910.0" y="452" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">安提帕後來的妻子</text><text x="910.0" y="475" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">同時也是安提帕的姪女</text></a><rect x="1080" y="390" width="260" height="112" rx="14" fill="#fffdf8" stroke="#cfbd9c" stroke-width="2"/><text x="1210.0" y="424" font-size="21" fill="#203544" font-weight="700" text-anchor="middle">亞基帕一世</text><text x="1210.0" y="452" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">希羅底的兄弟；39年取代安提帕</text><text x="1210.0" y="475" font-size="15" fill="#203544" font-weight="400" text-anchor="middle">徒12中的希律，不是安提帕</text><path d="M460 297 V446 H780" fill="none" stroke="#a9703c" stroke-width="2.5" stroke-dasharray="7 6"/><text x="584" y="422" font-size="17" fill="#203544" font-weight="400" text-anchor="middle">婚姻（虛線）</text><text x="690" y="557" font-size="18" fill="#203544" font-weight="400" text-anchor="middle">這是節錄家譜；省略配偶、其他子女與後代。親子線不表示同時在位。</text></g></svg>