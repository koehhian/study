<svg aria-label="政治實權關係圖" role="img" viewBox="0 0 1150 755" xmlns="http://www.w3.org/2000/svg"><title>政治實權關係圖</title><desc>提庇留之下，一側是羅馬總督體系，一側是附庸統治者安提帕。該亞法與領袖議會受到羅馬約束，亞那透過家族保有影響。彼拉多和安提帕分屬不同轄區，並非普通上下級。</desc><defs><marker id="authority_svg-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627d88"/></marker></defs><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><a href="#person-tiberius"><rect fill="#e7edf0" height="95" rx="14" stroke="#cfbd9c" stroke-width="2" width="300" x="425" y="20"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="575.0" y="54">羅馬皇帝：提庇留</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="575.0" y="82">最高統治權／任免與申訴的終點</text></a><path d="M425 70 H215 V165" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="315" y="140">帝國行政、軍事體系</text><a href="#person-vitellius"><rect fill="#fffdf8" height="95" rx="14" stroke="#cfbd9c" stroke-width="2" width="330" x="50" y="165"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="215.0" y="199">敘利亞行省長官</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="215.0" y="227">區域軍事優勢；必要時介入猶太</text></a><path d="M215 260 L215 350" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="350" y="311">監督與介入</text><a href="#person-pilate"><rect fill="#e7edf0" height="120" rx="14" stroke="#cfbd9c" stroke-width="2" width="330" x="50" y="350"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="215.0" y="384">本丟・彼拉多</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="215.0" y="412">猶太／撒馬利亞／以土買</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="215.0" y="435">羅馬軍隊、司法、最終處決</text></a><path d="M725 70 H935 V350" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="17" font-weight="400" text-anchor="middle" x="795" y="205">羅馬承認其領地</text><text fill="#203544" font-size="17" font-weight="400" text-anchor="middle" x="795" y="230">皇帝也能撤換他</text><a href="#person-antipas"><rect fill="#e7efe7" height="120" rx="14" stroke="#cfbd9c" stroke-width="2" width="330" x="770" y="350"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="935.0" y="384">希律・安提帕</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="935.0" y="412">加利利與比利亞的分封統治者</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="935.0" y="435">有領內軍政權；不是猶太巡撫</text></a><path d="M385 411 L765 411" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M765 427 L385 427" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="18" font-weight="700" text-anchor="middle" x="575" y="383">彼此不是一般上下級</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="575" y="457">本案：彼拉多送交，安提帕送回</text><path d="M198 470 L198 605" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M232 605 L232 470" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="423" y="518">羅馬官府控制大祭司任免</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="423" y="547">地方領袖移送案件、施壓與交涉</text><a href="#person-caiaphas"><rect fill="#f4e8d8" height="120" rx="14" stroke="#cfbd9c" stroke-width="2" width="440" x="50" y="605"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="270.0" y="639">該亞法與耶路撒冷領袖議會</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="270.0" y="667">聖殿、差役、宗教及地方司法</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="270.0" y="690">不等於能獨立執行羅馬式十字架刑</text></a><a href="#person-annas"><rect fill="#f4e8d8" height="120" rx="14" stroke="#cfbd9c" stroke-width="2" width="330" x="770" y="605"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="935.0" y="639">亞那及祭司家族</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="935.0" y="667">前大祭司；保有家族與人脈影響</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="935.0" y="690">亞那是該亞法的岳父</text></a><path d="M770 668 L490 668" fill="none" marker-end="url(#authority_svg-arrow)" stroke="#627d88" stroke-dasharray="7 6" stroke-width="2.5"/><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="630" y="635">親屬與非正式影響</text></g></svg>