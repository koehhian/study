<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 655" role="img" aria-label="傳道地區與政治轄區示意圖"><title>傳道地區與政治轄區示意圖</title><desc>耶穌活動跨越不同政權領地：加利利與比利亞屬安提帕，耶路撒冷所在猶太以及撒馬利亞屬羅馬長官，東北諸地屬分封王腓力。此圖只示意相對方位，並非歷史邊界地圖。</desc><defs><marker id="territory_svg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627d88"/></marker></defs><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><text x="505" y="40" font-size="24" fill="#203544" font-weight="700" text-anchor="middle">約公元30年前後：轄區示意，不按比例</text><rect x="150" y="85" width="310" height="160" rx="14" fill="#e7efe7" stroke="#cfbd9c" stroke-width="2"/><text x="305.0" y="119" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">加利利</text><text x="305.0" y="147" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">拿撒勒、迦百農、提比哩亞</text><text x="305.0" y="170" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">統治者：希律・安提帕</text><text x="305.0" y="193" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">耶穌公開傳道的主要地區</text><rect x="650" y="85" width="310" height="160" rx="14" fill="#eee8f4" stroke="#cfbd9c" stroke-width="2"/><text x="805.0" y="119" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">加利利海東北諸地</text><text x="805.0" y="147" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">凱撒利亞腓立比一帶</text><text x="805.0" y="170" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">統治者：分封王腓力</text><text x="805.0" y="193" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">與安提帕領地不可混同</text><rect x="150" y="280" width="310" height="126" rx="14" fill="#e7edf0" stroke="#cfbd9c" stroke-width="2"/><text x="305.0" y="314" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">撒馬利亞</text><text x="305.0" y="342" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">羅馬直轄統治區的一部分</text><text x="305.0" y="365" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">彼拉多的行政與司法權所及</text><rect x="150" y="435" width="310" height="175" rx="14" fill="#e7edf0" stroke="#cfbd9c" stroke-width="2"/><text x="305.0" y="469" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">猶太與以土買</text><text x="305.0" y="497" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">耶路撒冷在此；聖殿與受難地</text><text x="305.0" y="520" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">羅馬長官：彼拉多</text><text x="305.0" y="543" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">凱撒利亞海港為主要駐地</text><rect x="650" y="310" width="310" height="175" rx="14" fill="#e7efe7" stroke="#cfbd9c" stroke-width="2"/><text x="805.0" y="344" font-size="22" fill="#203544" font-weight="700" text-anchor="middle">比利亞</text><text x="805.0" y="372" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">約旦河以東的另一塊領地</text><text x="805.0" y="395" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">統治者仍是希律・安提帕</text><text x="805.0" y="418" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">與加利利同屬安提帕</text><path d="M545 140 C590 230 520 320 560 415 S565 550 575 625" fill="none" stroke="#81a6b7" stroke-width="2.5"/><text x="580" y="276" font-size="16" fill="#203544" font-weight="400" text-anchor="middle">約旦河</text><text x="65" y="323" font-size="18" fill="#203544" font-weight="400" text-anchor="middle">地中海</text><path d="M1060 180 L1060 97" fill="none" stroke="#627d88" stroke-width="2.5" marker-end="url(#territory_svg-arrow)"/><text x="1060" y="75" font-size="17" fill="#203544" font-weight="400" text-anchor="middle">北</text></g></svg>