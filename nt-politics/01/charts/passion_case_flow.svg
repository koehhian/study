<svg aria-label="受難人物與案件流向圖" role="img" viewBox="0 0 1020 858" xmlns="http://www.w3.org/2000/svg"><title>受難人物與案件流向圖</title><desc>綜合四福音書的功能性流程，不是聲稱所有福音書具有完全相同的時間表。猶大、亞那、該亞法、彼拉多、安提帕、巴拉巴、群眾、羅馬士兵及安葬者的關係。</desc><defs><marker id="trial_svg-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#627d88"/></marker></defs><g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif"><a href="#person-judas"><rect fill="#f4e8d8" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="30" y="35"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="172.5" y="69">祭司領袖與猶大</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="97">猶大提供秘密逮捕的機會</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="120">不是三方公開聯合審判</text></a><path d="M315 91 L365 91" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><a href="#person-annas"><rect fill="#fffdf8" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="365" y="35"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="507.5" y="69">逮捕、帶到亞那</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="97">先到亞那：見約18</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="120">約翰另提兵隊及軍官</text></a><path d="M650 91 L700 91" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><a href="#person-caiaphas"><rect fill="#f4e8d8" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="700" y="35"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="842.5" y="69">該亞法／領袖會議</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="97">福音書記述的安排不全相同</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="120">宗教指控與除掉耶穌的決議</text></a><path d="M843 147 V212 H510 V270" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="17" font-weight="700" text-anchor="middle" x="684" y="204">轉為羅馬可處理的政治控訴</text><a href="#person-pilate"><rect fill="#e7edf0" height="117" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="365" y="270"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="507.5" y="304">彼拉多</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="332">核心指控：自稱王、煽動百姓</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="355">本案判刑權的中心</text></a><a href="#person-antipas"><rect fill="#e7efe7" height="117" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="700" y="270"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="842.5" y="304">希律・安提帕</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="332">訊問、戲弄、送回</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="355">僅路23記此程序</text></a><path d="M650 314 L700 314" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M700 350 L650 350" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="14" font-weight="400" text-anchor="middle" x="675" y="296">送交</text><text fill="#203544" font-size="14" font-weight="400" text-anchor="middle" x="675" y="378">送回</text><a href="#person-crowd"><rect fill="#fffdf8" height="117" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="30" y="270"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="172.5" y="304">現場群眾</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="332">祭司長煽動；要求處死耶穌</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="355">不是全體猶太人的投票</text></a><path d="M315 328 L365 328" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-dasharray="7 6" stroke-width="2.5"/><path d="M510 387 V445 H173 V500" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M510 387 V500" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M510 445 H843 V500" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><text fill="#203544" font-size="18" font-weight="400" text-anchor="middle" x="125" y="477">釋放</text><text fill="#203544" font-size="18" font-weight="400" text-anchor="middle" x="725" y="477">交羅馬士兵執行</text><a href="#person-barabbas"><rect fill="#fffdf8" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="30" y="500"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="172.5" y="534">巴拉巴</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="562">與作亂、殺人事件有關的囚犯</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="585">其後生平不詳</text></a><rect fill="#efe6cf" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="365" y="500"/><text fill="#203544" font-size="22" font-weight="700" text-anchor="middle" x="507.5" y="534">主耶穌</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="562">拒絕以武力自救</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="585">不是武裝叛亂的領袖</text><rect fill="#e7edf0" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="700" y="500"/><text fill="#203544" font-size="20" font-weight="700" text-anchor="middle" x="842.5" y="534">羅馬軍人／百夫長</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="562">鞭打、戲弄、十字架處決</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="842.5" y="585">彼拉多批准領取遺體</text><path d="M843 612 V670 H510 V715" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><path d="M510 612 V715" fill="none" marker-end="url(#trial_svg-arrow)" stroke="#627d88" stroke-width="2.5"/><a href="#person-joseph"><rect fill="#e7efe7" height="112" rx="14" stroke="#cfbd9c" stroke-width="2" width="285" x="365" y="715"/><text fill="#203544" font-size="21" font-weight="700" text-anchor="middle" x="507.5" y="749">約瑟與尼哥底母</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="777">領袖群體中並非人人同意處死</text><text fill="#203544" font-size="16" font-weight="400" text-anchor="middle" x="507.5" y="800">領取並安葬耶穌遺體</text></a></g></svg>